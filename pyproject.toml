[project]
name = "interface-ai-poc"
version = "0.1.0"
description = "Computer-use automation: an LLM discovers a UI flow once, then it replays deterministically."
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "poethepoet>=0.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "src/target_app"]

# One command per step: `uv run poe check`
[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
typecheck = "mypy src tests"
test = "pytest"
check = ["lint", "typecheck", "test"]
app = "python -m target_app.server"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # modern syntax
    "B",        # likely bugs
    "SIM",      # needless complexity
    "C90",      # function complexity - see ARCHITECTURE.md section 4
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["src", "tests"]
python_files = ["*_test.py", "test_*.py"]
addopts = "-q"
